<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | KGrace Photography</title>
  <meta name="description" content="Full portfolio — KGrace Photography. Browse graduation, portrait, family, maternity, newborn, and lifestyle sessions in San Antonio, TX.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav id="navbar" class="scrolled">
    <div class="nav-inner">
      <a href="index.html" class="logo">KGrace <span>Photography</span></a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li>
          <a href="https://www.instagram.com/photosbykgrace" target="_blank" rel="noopener" class="nav-ig">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
            @photosbykgrace
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Full Portfolio Gallery -->
  <section id="gallery" class="portfolio-page">
    <div class="section-header">
      <p class="eyebrow">Portfolio</p>
      <h2>The Full Collection</h2>
    </div>

    <div class="filter-bar" role="group" aria-label="Filter gallery">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="graduation">Graduation</button>
      <button class="filter-btn" data-filter="portrait">Portraits</button>
      <button class="filter-btn" data-filter="family">Family</button>
      <button class="filter-btn" data-filter="maternity">Maternity</button>
      <button class="filter-btn" data-filter="children-kids">Kids</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous photo">&#8249;</button>
    <button class="lb-next" aria-label="Next photo">&#8250;</button>
    <div class="lb-img-wrap">
      <img id="lbImg" src="" alt="">
    </div>
    <p id="lbCaption" class="lb-caption"></p>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <p class="footer-logo">KGrace Photography</p>
      <p class="footer-location">San Antonio, TX &amp; Surrounding Areas</p>
      <div class="footer-links">
        <a href="https://www.instagram.com/photosbykgrace" target="_blank" rel="noopener">@photosbykgrace</a>
        <a href="https://www.instagram.com/kaceykickhoefer" target="_blank" rel="noopener">@kaceykickhoefer</a>
      </div>
      <p class="footer-copy">&copy; <span id="year"></span> KGrace Photography. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
